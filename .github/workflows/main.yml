name: Embroidery AI Studio CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "No requirements.txt found, skipping..."
        pip install fastapi uvicorn sqlalchemy alembic pydantic passlib python-jose pyembroidery shapely rembg opencv-python-headless python-multipart
    - name: Run Backend Linting
      working-directory: ./backend
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci || npm install
    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint || true
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
